name: TAIEX F15 isolated tests
on:
  pull_request:
    paths:
      - 'taiex_market_history_v1.py'
      - 'taiex_twse_store_v1.py'
      - 'f15_taiex_maintenance_v1.py'
      - 'tests/test_taiex_*.py'
      - '.github/workflows/taiex-f15-tests.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -p 'test_taiex_*.py' -v
