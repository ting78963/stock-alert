name: Candidate A to B isolated handoff
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify independent VCP and legacy B dedupe
        run: python -m unittest discover -s tests -p test_vcp_independent_handoff.py -v
