name: USD TWD public symbol availability probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/usdtwd-source-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Basic USD/TWD quote entitlement when secret exists
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          key=os.getenv("TWELVEDATA_API_KEY")
          if not key:
              print("LIVE_QUOTE_CHECK=SKIPPED (TWELVEDATA_API_KEY not configured)")
              raise SystemExit(0)
          url="https://api.twelvedata.com/quote?"+urllib.parse.urlencode({"symbol":"USD/TWD","apikey":key})
          try:
              with urllib.request.urlopen(url,timeout=15) as response:
                  payload=json.load(response)
              if payload.get("status")=="error" or payload.get("code"):
                  print("LIVE_QUOTE_CHECK=UNAVAILABLE",payload.get("code"),payload.get("message"))
              elif payload.get("close") is not None:
                  print("LIVE_QUOTE_CHECK=PRICE_RETURNED")
                  print("HAS_DATETIME="+str(bool(payload.get("datetime"))))
                  print("HAS_TIMESTAMP="+str(bool(payload.get("timestamp"))))
                  print("NOTE: Market freshness must still be checked at 08:55.")
              else:
                  print("LIVE_QUOTE_CHECK=UNVERIFIED",sorted(payload.keys()))
          except Exception as exc:
              print("LIVE_QUOTE_CHECK=UNVERIFIED",type(exc).__name__)
          PY
      - name: Verify USD/TWD previous daily closes when secret exists
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          key=os.getenv("TWELVEDATA_API_KEY")
          if not key:
              print("DAILY_CLOSE_CHECK=SKIPPED (TWELVEDATA_API_KEY not configured)")
              raise SystemExit(0)
          params={"symbol":"USD/TWD","interval":"1day","outputsize":5,"apikey":key}
          url="https://api.twelvedata.com/time_series?"+urllib.parse.urlencode(params)
          try:
              with urllib.request.urlopen(url,timeout=15) as response:
                  payload=json.load(response)
              if payload.get("status")=="error" or payload.get("code"):
                  print("DAILY_CLOSE_CHECK=UNAVAILABLE",payload.get("code"),payload.get("message"))
              else:
                  values=payload.get("values") or []
                  print("DAILY_CLOSE_CHECK="+("ROWS_RETURNED" if values else "NO_ROWS"))
                  print("ROW_COUNT="+str(len(values)))
                  print("HAS_DATE="+str(bool(values and values[0].get("datetime"))))
                  print("NOTE: Exclude current unfinished day before comparison.")
          except Exception as exc:
              print("DAILY_CLOSE_CHECK=UNVERIFIED",type(exc).__name__)
          PY
      - name: Check USD/TWD listed in Twelve Data public forex catalog
        run: |
          python - <<'PY'
          import json,urllib.request
          url="https://api.twelvedata.com/forex_pairs?symbol=USD%2FTWD"
          try:
              req=urllib.request.Request(url,headers={"User-Agent":"stock-alert-source-verification/1.0"})
              with urllib.request.urlopen(req,timeout=15) as response:
                  payload=json.load(response)
              if isinstance(payload,dict) and "data" in payload:
                  pairs=payload["data"]
              elif isinstance(payload,list):
                  pairs=payload
              else:
                  print("CATALOG_UNVERIFIED",str(payload)[:350])
                  raise SystemExit(0)
              found=[p for p in pairs if isinstance(p,dict) and p.get("symbol")=="USD/TWD"]
              print("USD_TWD_LISTED="+str(bool(found)))
              print("MATCHES="+str(found[:1]))
              print("NOTE: Listing does not prove free tier entitlement or live quote freshness.")
          except Exception as exc:
              print("CATALOG_UNVERIFIED",type(exc).__name__,str(exc)[:200])
          PY
