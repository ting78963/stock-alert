name: Per-symbol quarantine offline tests
on:
  pull_request:
    paths:
      - 'research/per_symbol_exception_policy_v1.py'
      - 'tests/test_per_symbol_exception_policy_v1.py'
      - 'tests/test_quarantine_sqlite_v1.py'
      - 'a_history_preflight_v1.py'
      - 'fugle_a_scanner_v2_4.py'
      - '.github/workflows/per-symbol-quarantine-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile changed Python
        run: python -m py_compile research/per_symbol_exception_policy_v1.py tests/test_per_symbol_exception_policy_v1.py tests/test_quarantine_sqlite_v1.py a_history_preflight_v1.py fugle_a_scanner_v2_4.py
      - name: Isolated unit tests
        run: python -m unittest discover -s tests -p 'test_*quarantine*' -v && python -m unittest discover -s tests -p 'test_per_symbol_exception_policy_v1.py' -v
