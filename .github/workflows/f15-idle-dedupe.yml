name: F15 idle dedupe
on:
  pull_request:
    paths:
      - 'f15_trajectory_store.py'
      - 'production_worker_v2_shared_ws.py'
      - 'test_f15_idle_dedupe.py'
      - '.github/workflows/f15-idle-dedupe.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile production_worker_v2_shared_ws.py f15_trajectory_store.py
      - run: python -m unittest -v test_f15_idle_dedupe
