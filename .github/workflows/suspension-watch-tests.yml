name: Suspension watch offline tests
on:
  pull_request:
    paths:
      - 'research/phase1_fugle_daily_builder_v1.py'
      - 'research/a_daily_incremental_maintenance_v1.py'
      - 'research/test_suspension_watch_v1.py'
      - '.github/workflows/suspension-watch-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile research/phase1_fugle_daily_builder_v1.py research/a_daily_incremental_maintenance_v1.py research/test_suspension_watch_v1.py
      - name: Offline tests
        run: python -m unittest discover -s research -p 'test_suspension_watch_v1.py' -v
