name: Premarket live public quote probe
on:
  push:
    branches: [codex/premarket-sox-yahoo-isolated-20261124]
    paths:
      - '.github/workflows/premarket-live-probe.yml'
  pull_request:
    paths:
      - '.github/workflows/premarket-live-probe.yml'
      - 'research/premarket_live_probe_v1.py'
  workflow_dispatch:
jobs:
  public-quotes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m research.premarket_live_probe_v1
