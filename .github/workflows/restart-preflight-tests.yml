name: Restart preflight safety tests
on:
  pull_request:
    paths:
      - 'tools/restart_preflight.py'
      - 'tests/test_restart_preflight.py'
      - '.github/workflows/restart-preflight-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated safety tests
        run: python -m unittest discover -s tests -p 'test_restart_preflight.py' -v
