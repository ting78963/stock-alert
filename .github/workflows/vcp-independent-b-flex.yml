name: VCP independent B Flex regression
on:
  pull_request:
  push:
    branches:
      - codex/vcp-independent-b-flex-20261121
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_vcp_independent_handoff.py -v
