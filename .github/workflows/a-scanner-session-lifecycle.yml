name: A scanner session lifecycle regression
on: [push, pull_request]
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python - <<'PY'
          import ast, os
          from pathlib import Path
          from datetime import datetime
          from types import SimpleNamespace
          scanner = ast.parse(Path("fugle_a_scanner_v2_4.py").read_text())
          main = next(n for n in scanner.body if isinstance(n, ast.FunctionDef) and n.name == "main")
          loop = next(n for n in main.body if isinstance(n, ast.While))
          branch = next(n for n in loop.body if isinstance(n, ast.If))
          def check_exit():
              pass
          fn = ast.FunctionDef(name="offhours", args=ast.arguments(posonlyargs=[],args=[],kwonlyargs=[],kw_defaults=[],defaults=[]),body=branch.orelse,decorator_list=[])
          calls=[]
          ns={"os":os,"time":SimpleNamespace(sleep=lambda n:calls.append(n))}
          exec(compile(ast.fix_missing_locations(ast.Module(body=[fn],type_ignores=[])),"<offhours>","exec"),ns)
          os.environ["A_VERIFIED_SNAPSHOT_DAY"]="2026-11-26"
          assert ns["offhours"]()==0 and not calls
          del os.environ["A_VERIFIED_SNAPSHOT_DAY"]
          assert ns["offhours"]() is None and calls==[20]
          worker=ast.parse(Path("production_worker_v2_shared_ws.py").read_text())
          parent=next(n for n in worker.body if isinstance(n,ast.FunctionDef) and n.name=="main")
          launch=next(n for n in parent.body if isinstance(n,ast.While))
          assert ast.unparse(launch.body[0])=="wait_session()"
          gate=next(n for n in worker.body if isinstance(n,ast.FunctionDef) and n.name=="wait_session")
          class Clock:
              def __init__(self, times): self.times=iter(times)
              def __call__(self): return next(self.times)
          sleeps=[]
          ns={"now_tpe":Clock([datetime(2026,11,26,13,30),datetime(2026,11,27,8,59),datetime(2026,11,27,9,0)]),"time":SimpleNamespace(sleep=lambda n:sleeps.append(n)),"is_scheduled_open":lambda d:True}
          exec(compile(ast.fix_missing_locations(ast.Module(body=[gate],type_ignores=[])),"<gate>","exec"),ns)
          ns["wait_session"]()
          assert sleeps==[1800,300], sleeps
          print("PASS: production exit, standalone wait, parent session gate and next-day launch")
          PY
