name: F15 trajectory lazy engine regression
on:
  pull_request:
    paths:
      - 'f15_trajectory_store.py'
      - 'f15_eod_signal_report.py'
      - 'tests/test_f15_eod_completed_loop.py'
      - 'tests/test_f15_trajectory_lazy_engine.py'
      - '.github/workflows/f15-trajectory-regression.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_f15_trajectory_lazy_engine.py' -v
      - run: python -m unittest discover -s tests -p 'test_f15_eod_completed_loop.py' -v
