name: TWSE ROC holiday regression
on:
  push:
    branches:
      - fix/twse-roc-holiday-gate-20261026
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest -v test_twse_session_gate_roc_v1.py
