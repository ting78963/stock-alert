name: VCP EOD watchlist
on:
  push:
    branches: ['codex/vcp-eod-watchlist-20261126']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile vcp_eod_watchlist_v1.py production_worker_v2_shared_ws.py
      - run: python -m unittest -v test_vcp_eod_watchlist
