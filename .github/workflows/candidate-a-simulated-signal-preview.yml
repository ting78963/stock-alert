name: Candidate A simulated signal preview
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate independent VCP and SURGE FLOW paths
        run: python -m unittest discover -s tests -p test_vcp_independent_handoff.py -v
