name: Daily safe restart regression
on:
  pull_request:
    paths:
      - 'production_worker_v2_shared_ws.py'
      - 'test_daily_safe_restart.py'
      - '.github/workflows/daily-safe-restart.yml'
  workflow_dispatch:
jobs:
  offline-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_daily_safe_restart.py
