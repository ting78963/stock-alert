name: Recognition LINE isolated test
on:
  push:
    branches: [fix/recognition-line-endpoint-after-shutdown-20261027]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_recognition_line_once_v1
