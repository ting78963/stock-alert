name: Daily auto quarantine regression
on:
  pull_request:
    paths:
      - 'research/phase1_fugle_daily_builder_v1.py'
      - 'tests/test_daily_auto_quarantine_classification.py'
      - '.github/workflows/test-daily-auto-quarantine.yml'
  push:
    paths:
      - 'research/phase1_fugle_daily_builder_v1.py'
      - 'tests/test_daily_auto_quarantine_classification.py'
      - '.github/workflows/test-daily-auto-quarantine.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_daily_auto_quarantine_classification.py' -v
