name: Isolated LINE indicator tests
on:
  push:
    branches:
      - feature/line-indicator-display-isolated-20261026
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated indicator regression tests
        run: python -m unittest -v test_line_indicator_calculations_v1.py test_line_indicator_website_parity_v1.py test_line_indicator_flex_preview_v1.py test_line_indicator_history_preflight_v1.py test_line_indicator_partial_day_v1.py test_line_indicator_snapshot_v1.py test_line_indicator_b_send_failopen_v1.py test_line_indicator_notifier_v3_v1.py test_twse_session_gate_roc_v1.py
